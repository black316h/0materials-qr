<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竑記專用進銷存系統</title>
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: #e2e0d8;
    --border-dark: #c8c5bc;
    --text: #1a1916;
    --text-2: #6b6a65;
    --text-3: #9b9a95;
    --accent: #1a6b4a;
    --accent-light: #e8f5ee;
    --accent-text: #0f4a32;
    --blue: #1a4a8a;
    --blue-light: #e8f0fb;
    --blue-text: #0f2f5a;
    --red: #c0392b;
    --red-light: #fdecea;
    --font-head: 'Georgia', serif;
    --font-body: 'Helvetica Neue', Arial, sans-serif;
    --radius: 8px;
    --radius-lg: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: var(--font-body); color: var(--text); min-height: 100vh; }

  header {
    background: var(--text); color: #fff;
    padding: 0 2rem; display: flex; align-items: center; justify-content: space-between;
    height: 52px; position: sticky; top: 0; z-index: 100;
  }
  header h1 { font-family: var(--font-head); font-size: 16px; font-weight: normal; letter-spacing: 0.04em; }
  header nav { display: flex; gap: 2px; }
  header nav a {
    color: rgba(255,255,255,0.65); text-decoration: none; font-size: 13px;
    padding: 6px 14px; border-radius: var(--radius); transition: all 0.15s;
  }
  header nav a:hover, header nav a.active { color: #fff; background: rgba(255,255,255,0.12); }

  .main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
  .page { display: none; }
  .page.active { display: block; }
  .page-title { font-family: var(--font-head); font-size: 22px; font-weight: normal; margin-bottom: 1.5rem; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem 1.5rem; margin-bottom: 1rem; }
  .card-title { font-size: 13px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 1rem; }

  .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group label { font-size: 12px; color: var(--text-2); font-weight: 500; }
  input, select, textarea {
    font-family: var(--font-body); font-size: 13px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--bg); color: var(--text); width: 100%; transition: border-color 0.15s;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  input[readonly] { color: var(--text-3); cursor: not-allowed; }

  .btn {
    font-family: var(--font-body); font-size: 13px; padding: 8px 16px;
    border-radius: var(--radius); border: 1px solid var(--border-dark);
    background: var(--surface); color: var(--text); cursor: pointer;
    transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: var(--bg); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-text); }
  .btn-sm { font-size: 12px; padding: 5px 10px; }
  .btn-danger { color: var(--red); border-color: transparent; background: none; padding: 4px 8px; }
  .btn-danger:hover { background: var(--red-light); }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

  /* Brand management */
  .brand-card-title {
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; user-select: none;
  }
  #brand-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 12px; min-height: 28px; }
  .brand-chip {
    display: inline-flex; align-items: center; gap: 3px;
    background: var(--blue-light); color: var(--blue-text);
    padding: 3px 6px 3px 10px; border-radius: 99px; font-size: 12px;
  }
  .chip-del {
    background: none; border: none; cursor: pointer; color: var(--blue-text);
    font-size: 15px; line-height: 1; padding: 0 2px; opacity: 0.5;
  }
  .chip-del:hover { opacity: 1; }
  .brand-add-row { display: flex; gap: 8px; align-items: center; }
  .brand-add-row input { max-width: 220px; }

  /* Table */
  .search-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .search-row input { max-width: 280px; }
  .search-row span { font-size: 12px; color: var(--text-3); margin-left: auto; }
  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn { font-size: 12px; padding: 4px 12px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); cursor: pointer; transition: all 0.15s; }
  .filter-btn.active { background: var(--text); color: #fff; border-color: var(--text); }

  .table-wrap { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; background: var(--surface); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: var(--bg); padding: 9px 12px; text-align: left; font-size: 11px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--border); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg); }
  tr.editing td { background: #fffdf5; }

  /* Inline edit inputs */
  .edit-sel, .edit-inp {
    font-family: var(--font-body); font-size: 12px; padding: 5px 7px;
    border: 1.5px solid var(--accent); border-radius: var(--radius);
    background: var(--surface); color: var(--text); width: 100%;
  }
  .edit-inp[type=number] { width: 80px; text-align: right; }

  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 500; }
  .badge-green { background: var(--accent-light); color: var(--accent-text); }
  .badge-blue { background: var(--blue-light); color: var(--blue-text); }

  .empty-state { text-align: center; padding: 3rem; color: var(--text-3); font-size: 13px; }

  /* 材料卡 */
  .card-inp {
    font-family: var(--font-body); font-size: 13px; padding: 6px 8px;
    border: 1px solid transparent; border-radius: 4px;
    background: transparent; color: var(--text); width: 100%;
  }
  .card-inp:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .card-inp::placeholder { color: var(--text-3); }
  .card-inp[type=number] { text-align: right; -moz-appearance: textfield; padding: 6px 4px; }
  .card-inp[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  #inv-items-tbody td { padding: 4px 4px; }
  #inv-items-tbody td:first-child { padding-left: 8px; }

  .toast {
    position: fixed; bottom: 2rem; right: 2rem;
    background: var(--text); color: #fff; padding: 10px 18px;
    border-radius: var(--radius); font-size: 13px; opacity: 0;
    transform: translateY(8px); transition: all 0.2s; pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  .modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem; }
  .modal-content { background:var(--surface);border-radius:var(--radius-lg);padding:1.5rem;max-width:700px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.15); }
  .modal-content .card-title { margin-bottom:1rem; }

  @media (max-width: 600px) {
    header { padding: 0 1rem; }
    .main { padding: 1rem; }
  }
</style>
</head>
<body>

<header>
  <h1>竑記專用進銷存系統</h1>
  <nav>
    <a href="#" class="active" onclick="showPage('master',this);return false">材料主檔</a>
    <a href="#" onclick="showPage('card',this);return false">材料卡</a>
    <a href="#" onclick="showPage('invoice',this);return false">出貨單</a>
    <a href="#" onclick="showPage('sales',this);return false">銷貨紀錄</a>
  </nav>
</header>

<div class="main">

<!-- ── 材料主檔 ── -->
<div id="page-master" class="page active">
  <div class="page-title">材料主檔管理</div>

  <!-- 新增表單 -->
  <div class="card">
    <div class="card-title">新增材料</div>
    <div class="form-grid">
      <div class="form-group">
        <label>廠牌 <span style="color:var(--red)">*</span></label>
        <select id="f-brand" onchange="buildModelList()"></select>
      </div>
      <div class="form-group" style="grid-column:span 2">
        <label>型號 / 規格 <span style="color:var(--red)">*</span></label>
        <input id="f-model" placeholder="例：MS0-P30T HP 220V" list="model-list">
      </div>
      <div class="form-group">
        <label>類別</label>
        <select id="f-cat" onchange="buildModelList()"></select>
      </div>
      <div class="form-group">
        <label>單價（元）</label>
        <input id="f-price" type="number" placeholder="0" min="0">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="addMaterial()">＋ 新增</button>
      <button class="btn" onclick="clearForm()">清除</button>
    </div>
  </div>

  <!-- 廠牌管理（可收合） -->
  <div class="card">
    <div class="brand-card-title card-title" onclick="toggleBrandMgmt()" style="margin-bottom:0">
      <span>廠牌管理</span>
      <span id="brand-arrow" style="font-size:14px;font-weight:normal">▸</span>
    </div>
    <div id="brand-mgmt-body" style="display:none;margin-top:1rem">
      <div id="brand-chips"></div>
      <div class="brand-add-row">
        <input id="f-new-brand" placeholder="輸入新廠牌名稱">
        <button class="btn btn-primary btn-sm" onclick="addBrand()">＋ 新增廠牌</button>
      </div>
    </div>
  </div>

  <!-- 類別管理（可收合） -->
  <div class="card">
    <div class="brand-card-title card-title" onclick="toggleCatMgmt()" style="margin-bottom:0">
      <span>類別管理</span>
      <span id="cat-arrow" style="font-size:14px;font-weight:normal">▸</span>
    </div>
    <div id="cat-mgmt-body" style="display:none;margin-top:1rem">
      <div id="cat-chips"></div>
      <div class="brand-add-row">
        <input id="f-new-cat" placeholder="輸入新類別名稱">
        <button class="btn btn-primary btn-sm" onclick="addCat()">＋ 新增類別</button>
      </div>
    </div>
  </div>

  <!-- 搜尋列 -->
  <div class="search-row">
    <input id="search" placeholder="搜尋廠牌、型號…" oninput="renderTable()">
    <div class="filter-row" id="filter-row"></div>
    <span id="mat-count"></span>
  </div>

  <!-- 資料表 -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:90px">廠牌</th>
          <th>型號 / 規格</th>
          <th style="width:95px">類別</th>
          <th style="width:75px">單價</th>
          <th style="width:185px"></th>
        </tr>
      </thead>
      <tbody id="mat-tbody"></tbody>
    </table>
  </div>
</div>

<!-- ── QR 碼 ── -->
<!-- ── 材料卡 ── -->
<div id="page-card" class="page">
  <div class="page-title">材料卡</div>
  <div class="card">
    <div class="card-title">卡片資訊</div>
    <div class="form-grid">
      <div class="form-group">
        <label>客戶名稱 <span style="color:var(--red)">*</span></label>
        <select id="card-customer"><option value="">選擇客戶</option></select>
      </div>
      <div class="form-group">
        <label>編號</label>
        <input id="card-no" placeholder="編號">
      </div>
      <div class="form-group" style="grid-column:span 2">
        <label>案件名稱 <span style="color:var(--red)">*</span></label>
        <select id="card-project"><option value="">選擇案件</option></select>
      </div>
      <div class="form-group">
        <label>日期</label>
        <input id="card-date" type="date">
      </div>
    </div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn" onclick="addCardRow()">＋ 新增行</button>
      <button class="btn" onclick="showMaterialPicker('card')" style="background:var(--accent-light);color:var(--accent-text);border-color:var(--accent-light)">＋ 從材料主檔選取</button>
      <button class="btn" onclick="clearCard()">清空</button>
      <button class="btn btn-primary" onclick="createCardSheet()">建立 Google Sheet</button>
      <a class="btn" href="https://drive.google.com/drive/folders/1XdVo2Io5cXgqZpL3KWpCDit0wiZOd-_3" target="_blank" style="text-decoration:none;display:inline-flex;align-items:center;gap:4px">📁 材料卡資料夾</a>
      <span id="card-status" style="font-size:12px;color:var(--text-3);align-self:center;margin-left:auto"></span>
    </div>
  </div>

  <!-- 客戶管理（可收合） -->
  <div class="card" style="margin-top:1rem">
    <div class="brand-card-title card-title" onclick="toggleCustMgmt()" style="margin-bottom:0">
      <span>客戶管理</span>
      <span id="cust-arrow" style="font-size:14px;font-weight:normal">▸</span>
    </div>
    <div id="cust-mgmt-body" style="display:none;margin-top:1rem">
      <div id="cust-chips"></div>
      <div class="brand-add-row">
        <input id="f-new-cust" placeholder="輸入新客戶名稱">
        <button class="btn btn-primary btn-sm" onclick="addCustomer()">＋ 新增客戶</button>
      </div>
    </div>
  </div>

  <!-- 案件管理（可收合） -->
  <div class="card" style="margin-top:1rem">
    <div class="brand-card-title card-title" onclick="toggleProjMgmt()" style="margin-bottom:0">
      <span>案件管理</span>
      <span id="proj-arrow" style="font-size:14px;font-weight:normal">▸</span>
    </div>
    <div id="proj-mgmt-body" style="display:none;margin-top:1rem">
      <div id="proj-chips"></div>
      <div class="brand-add-row">
        <input id="f-new-proj" placeholder="輸入新案件名稱">
        <button class="btn btn-primary btn-sm" onclick="addProject()">＋ 新增案件</button>
      </div>
    </div>
  </div>

  <div class="table-wrap" style="margin-top:1rem">
    <table>
      <thead>
        <tr>
          <th style="width:46px">序號</th>
          <th style="width:90px">廠牌</th>
          <th>型號</th>
          <th style="width:95px">類別</th>
          <th style="width:65px">數量</th>
          <th style="width:85px">金額</th>
          <th style="width:32px"></th>
        </tr>
      </thead>
      <tbody id="card-tbody"></tbody>
      <tfoot>
        <tr style="background:var(--bg)">
          <td colspan="5" style="text-align:right;font-weight:700;border-bottom:none">合計</td>
          <td style="font-weight:700;text-align:right;border-bottom:none" id="card-total-cell">$0</td>
          <td style="border-bottom:none"></td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>

<!-- ── 出貨單 ── -->
<div id="page-invoice" class="page">
  <div class="page-title">出貨單</div>
  <div class="btn-row" style="margin-bottom:1rem">
    <span id="invoice-status" style="font-size:12px;color:var(--text-3);align-self:center"></span>
  </div>
  <div class="card">
    <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr">
      <div class="form-group">
        <label>客戶名稱</label>
        <select id="inv-customer"><option value="">選擇客戶</option></select>
      </div>
      <div class="form-group">
        <label>出貨單號</label>
        <input id="inv-no" placeholder="單號">
      </div>
      <div class="form-group">
        <label>日期</label>
        <input id="inv-date" type="date">
      </div>
    </div>
  </div>
  <div class="card" style="margin-top:1rem">
    <div class="card-title">品項明細</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:28px">項次</th>
            <th>品名規格</th>
            <th style="width:48px">數量</th>
            <th style="width:58px">金額</th>
            <th style="width:58px">備註</th>
            <th style="width:22px"></th>
          </tr>
        </thead>
        <tbody id="inv-items-tbody"></tbody>
        <tfoot>
          <tr style="background:var(--bg)">
            <td colspan="3" style="text-align:right;font-weight:700;border-bottom:none">合計</td>
            <td style="font-weight:700;text-align:right;border-bottom:none" id="inv-total-cell">$0</td>
            <td colspan="2" style="border-bottom:none"></td>
          </tr>
        </tfoot>
      </table>
    </div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn btn-sm" onclick="addInvItem()">＋ 新增行</button>
      <button class="btn btn-sm" onclick="showMaterialPicker('invoice')" style="background:var(--accent-light);color:var(--accent-text);border-color:var(--accent-light)">＋ 從材料主檔選取</button>
    </div>
  </div>
  <div class="btn-row" style="margin-top:1rem">
    <button class="btn btn-primary" onclick="saveInvoice()">儲存出貨單</button>
    <button class="btn" onclick="newInvoice()">清除</button>
  </div>
</div>

<!-- ── 銷貨紀錄 ── -->
<div id="page-sales" class="page">
  <div class="page-title">銷貨紀錄</div>
  <div class="search-row">
    <input id="sales-search" placeholder="搜尋客戶、單號…" oninput="renderSalesTable()">
    <div class="filter-row" id="sales-filter-row">
      <button class="filter-btn active" onclick="setSalesFilter('all',this)">全部</button>
      <button class="filter-btn" onclick="setSalesFilter('month',this)">本月</button>
      <button class="filter-btn" onclick="setSalesFilter('week',this)">本週</button>
    </div>
    <span id="sales-count" style="font-size:12px;color:var(--text-3)"></span>
  </div>
  <div id="sales-loading" style="display:none;text-align:center;padding:2rem">
    <div style="font-size:14px;color:var(--text-2)">載入中…</div>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:90px">紀錄ID</th>
          <th style="width:90px">日期</th>
          <th>客戶名稱</th>
          <th style="width:90px">單號</th>
          <th style="width:90px">合計</th>
          <th style="width:50px"></th>
        </tr>
      </thead>
      <tbody id="sales-tbody"></tbody>
    </table>
  </div>
</div>

<!-- 材料選取 Modal -->
<div id="material-picker-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)hideMaterialPicker()">
  <div class="modal-content">
    <div class="card-title">從材料主檔選取</div>
    <input id="picker-search" placeholder="搜尋廠牌、型號…" oninput="filterPickerMaterials()" style="width:100%;margin-bottom:1rem">
    <div class="table-wrap" style="max-height:50vh;overflow-y:auto">
      <table>
        <thead>
          <tr>
            <th>廠牌</th>
            <th>型號</th>
            <th style="width:55px"></th>
          </tr>
        </thead>
        <tbody id="picker-tbody"></tbody>
      </table>
    </div>
    <div class="btn-row" style="margin-top:1rem;justify-content:flex-end">
      <button class="btn" onclick="hideMaterialPicker()">關閉</button>
    </div>
  </div>
</div>

<!-- 銷貨詳情 Modal -->
<div id="sales-detail-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)hideSalesDetail()">
  <div class="modal-content">
    <div class="card-title">出貨單詳情</div>
    <div id="sales-detail-content"></div>
    <div class="btn-row" style="margin-top:1rem;justify-content:flex-end">
      <button class="btn" onclick="hideSalesDetail()">關閉</button>
      <button class="btn btn-primary" id="sales-edit-btn" onclick="">編輯</button>
    </div>
  </div>
</div>

</div><!-- /.main -->
<datalist id="model-list"></datalist>
<div class="toast" id="toast"></div>

<script>
// ── 常數 ──────────────────────────────────────────────
const STORAGE_KEY_MAT    = 'mat_master_v2';
const STORAGE_KEY_BRANDS = 'mat_brands_v1';
const STORAGE_KEY_CATS   = 'mat_cats_v1';
const STORAGE_KEY_CUSTS  = 'mat_customers_v1';
const STORAGE_KEY_PROJS  = 'mat_projects_v1';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwr2o0j-xcsFHO7CaPTWomMkWshBQ39G3aRB25bPRN1DD-VCDq89_e971JnYLrrNPmUgQ/exec';

// ── 資料 ──────────────────────────────────────────────
function normalizeMat(m) {
  return {
    id:    m.id    || m['料號'] || '',
    brand: m.brand || m['廠牌'] || '',
    model: m.model || m['型號'] || '',
    price: Number(m.price ?? m['單價'] ?? 0),
    cat:   m.cat   || m['類別'] || ''
  };
}

// 同步到 Google Sheets（背景執行，不阻塞 UI）
function syncToCloud() {
  if (!GAS_URL) return;
  fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action: 'sync', materials, brands, cats, customers, projects })
  }).catch(() => {});
}
// 從 Google Sheets 載入資料（頁面開啟時呼叫）
async function loadFromCloud() {
  if (!GAS_URL) return;
  try {
    const resp = await fetch(GAS_URL);
    const data = await resp.json();
    if (data.materials && data.materials.length) {
      materials = data.materials.map(normalizeMat);
      brands    = data.brands    && data.brands.length    ? data.brands    : brands;
      cats      = data.cats      && data.cats.length      ? data.cats      : cats;
      customers = data.customers && data.customers.length ? data.customers : customers;
      projects  = data.projects  && data.projects.length  ? data.projects  : projects;
      localStorage.setItem(STORAGE_KEY_MAT,    JSON.stringify(materials));
      localStorage.setItem(STORAGE_KEY_BRANDS, JSON.stringify(brands));
      localStorage.setItem(STORAGE_KEY_CATS,   JSON.stringify(cats));
      localStorage.setItem(STORAGE_KEY_CUSTS,  JSON.stringify(customers));
      localStorage.setItem(STORAGE_KEY_PROJS,  JSON.stringify(projects));
      nextNum = materials.reduce((m,x) => Math.max(m, parseInt(x.id.slice(1))), 0) + 1;
      clearForm();
      renderFilterBtns();
      renderTable();
      buildModelList();
      renderCustOptions();
      renderProjOptions();
      toast('已從雲端載入資料');
    } else {
      syncToCloud();
    }
  } catch (err) {
    console.warn('雲端載入失敗，使用本機資料:', err);
  }
}
function pad(n) { return String(n).padStart(5, '0'); }
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function toast(msg, duration) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  const ms = duration || (msg.includes('失敗') || msg.includes('錯誤') ? 6000 : 2500);
  setTimeout(() => t.classList.remove('show'), ms);
}

  document.getElementById('f-model').value = '';

  document.getElementById('f-brand').innerHTML = renderBrandOptions(brands[0]);

function deleteMat(id) {
  const m = materials.find(x => x.id === id);
  const label = m ? (m.brand + ' ' + m.model) : id;
  if (!confirm('確定刪除 ' + label + '？')) return;
  materials = materials.filter(x => x.id !== id);
  if (editingId === id) { editingId = null; editBuf = {}; }
  save(); renderTable(); toast('已刪除：' + label);

// ── 內嵌編輯 ──────────────────────────────────────────
function startEdit(id) {
  const m = materials.find(x => x.id === id);
  if (!m) return;
  editingId = id;
  editBuf   = { brand: m.brand, model: m.model, cat: m.cat, price: m.price };
  renderTable();
}
function cancelEdit() {
  editingId = null; editBuf = {};
  renderTable();
}
function saveEdit(id) {
  const idx = materials.findIndex(x => x.id === id);
  if (idx < 0) return;
  const model = editBuf.model ? editBuf.model.trim() : '';
  if (!model) { toast('型號 / 規格不能為空'); return; }
  materials[idx] = { ...materials[idx], brand: editBuf.brand, model, cat: editBuf.cat, price: Number(editBuf.price) || 0 };
  save(); editingId = null; editBuf = {};
  renderTable(); toast('已儲存 ' + id);
}

// ── 渲染資料表 ────────────────────────────────────────
function renderTable() {
  const q    = (document.getElementById('search').value || '').toLowerCase();
  const rows = materials.filter(m => {
    const matchQ   = !q || (m.brand||'').toLowerCase().includes(q) || m.model.toLowerCase().includes(q);
    const matchCat = !filterCat || m.cat === filterCat;
    return matchQ && matchCat;
  });
  document.getElementById('mat-count').textContent = `共 ${rows.length} 筆`;
  const tbody = document.getElementById('mat-tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state">沒有符合的材料</div></td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(m => {
    if (m.id === editingId) {
      // 編輯列
      const brandOpts = renderBrandOptions(editBuf.brand);
      const catOpts   = renderCatOptions(editBuf.cat);
      return `<tr class="editing" data-id="${m.id}">
        <td><select class="edit-sel" onchange="editBuf.brand=this.value">${brandOpts}</select></td>
        <td><input class="edit-inp" value="${esc(editBuf.model)}" oninput="editBuf.model=this.value" style="min-width:160px"></td>
        <td><select class="edit-sel" onchange="editBuf.cat=this.value">${catOpts}</select></td>
        <td><input class="edit-inp" type="number" value="${editBuf.price}" oninput="editBuf.price=this.value" style="width:72px;text-align:right"></td>
        <td>
          <button class="btn btn-primary btn-sm" onclick="saveEdit('${m.id}')">儲存</button>
          <button class="btn btn-sm" onclick="cancelEdit()">取消</button>
        </td>
      </tr>`;
    }
    // 一般列
    return `<tr data-id="${m.id}">
      <td>${esc(m.brand || '—')}</td>
      <td style="font-size:12px">${esc(m.model)}</td>
      <td><span class="badge badge-green">${m.cat}</span></td>
      <td style="font-weight:500">$${(m.price || 0).toLocaleString()}</td>
      <td>
        <button class="btn btn-sm" onclick="startEdit('${m.id}')">編輯</button>
        <button class="btn btn-danger btn-sm" onclick="deleteMat('${m.id}')">刪除</button>
        <button class="btn btn-sm" style="background:var(--accent);color:#fff" onclick="addToCard('${m.id}')">材料卡</button>
        <button class="btn btn-sm" style="background:var(--blue);color:#fff" onclick="addToInvoice('${m.id}')">出貨單</button>
      </td>
    </tr>`;
  }).join('');
}

// ── 材料卡 ──────────────────────────────────────────────
function buildModelList() {
  const dl = document.getElementById('model-list');
  if (!dl) return;
  const selBrand = (document.getElementById('f-brand') || {}).value || '';
  const selCat   = (document.getElementById('f-cat')   || {}).value || '';
  const filtered = materials.filter(m => {
    if (selBrand && m.brand !== selBrand) return false;
    if (selCat && m.cat !== selCat) return false;
    return true;
  });
  dl.innerHTML = filtered.map(m => `<option value="${esc(m.model)}" label="${esc(m.brand)} ${esc(m.model)}">`).join('');
}

function addToCard(id) {
  const m = materials.find(x => x.id === id);
  if (!m) return;
  let idx = cardItems.findIndex(item => !item.brand && !item.model && !item.cat && !item.qty && !item.amount);
  if (idx < 0) { idx = cardItems.length; cardItems.push({ brand: '', model: '', cat: '', qty: '', amount: '' }); }
  cardItems[idx] = { brand: m.brand || '', model: m.model || '', cat: m.cat || '', qty: 1, amount: m.price || 0 };
  renderCardTable();
  calcCardTotal();
  toast('已加入材料卡：' + m.brand + ' ' + m.model);
}

function addToInvoice(id) {
  const m = materials.find(x => x.id === id);
  if (!m) return;
  let idx = invoiceItems.findIndex(it => !it.name && !it.qty && !it.amount);
  if (idx < 0) { idx = invoiceItems.length; invoiceItems.push({}); }
  invoiceItems[idx] = { seq: idx+1, name: (m.brand ? m.brand+' ' : '') + m.model, qty: 1, amount: '', note: '' };
  renderInvItems();
  calcInvTotal();
  toast('已加入出貨單：' + m.brand + ' ' + m.model);
}

const MIN_CARD_ROWS = 20;
let cardItems = [];

function initCardItems() {
  cardItems = [];
  for (let i = 0; i < MIN_CARD_ROWS; i++)
    cardItems.push({ brand: '', model: '', cat: '', qty: '', amount: '' });
}

function renderCardTable() {
  const tbody = document.getElementById('card-tbody');
  if (!tbody) return;
  tbody.innerHTML = cardItems.map((item, i) => `
    <tr>
      <td style="text-align:center;color:var(--text-3);font-size:12px">${i + 1}</td>
      <td><input class="card-inp" value="${esc(item.brand)}" oninput="cardItems[${i}].brand=this.value"></td>
      <td><input class="card-inp" value="${esc(item.model)}" oninput="cardItems[${i}].model=this.value" list="model-list"></td>
      <td><input class="card-inp" value="${esc(item.cat)}" oninput="cardItems[${i}].cat=this.value"></td>
      <td><input class="card-inp" type="number" value="${item.qty}" oninput="cardItems[${i}].qty=this.value;calcCardTotal()"></td>
      <td><input class="card-inp" type="number" value="${item.amount}" oninput="cardItems[${i}].amount=this.value;calcCardTotal()"></td>
      <td style="text-align:center"><button onclick="removeCardRow(${i})" style="background:none;border:none;cursor:pointer;color:var(--red);font-size:14px;opacity:0.4" title="清除此行">×</button></td>
    </tr>`).join('');
}

function calcCardTotal() {
  const total = cardItems.reduce((s, item) => s + (Number(item.amount) || 0), 0);
  const el = document.getElementById('card-total-cell');
  if (el) el.textContent = '$' + total.toLocaleString();
}

function addCardRow() {
  cardItems.push({ brand: '', model: '', cat: '', qty: '', amount: '' });
  renderCardTable();
}

function removeCardRow(i) {
  if (cardItems.length <= MIN_CARD_ROWS) {
    cardItems[i] = { brand: '', model: '', cat: '', qty: '', amount: '' };
  } else {
    cardItems.splice(i, 1);
  }
  renderCardTable();
  calcCardTotal();
}

async function loadQueuedItems() {
  const QUEUE_KEY = 'mat_card_queue';
  let localQueue = [];
  try { localQueue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch(e) {}

  let cloudQueue = [];
  try {
    const resp = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'queueLoad' })
    });
    const data = await resp.json();
    if (data.ok && data.items) cloudQueue = data.items;
  } catch(e) {
    console.warn('雲端 queue 載入失敗:', e);
  }

  const queue = [...localQueue, ...cloudQueue];
  if (localQueue.length) localStorage.removeItem(QUEUE_KEY);
  if (!queue.length) { renderCardTable(); return; }

  let insertIdx = cardItems.findIndex(item => !item.brand && !item.model && !item.cat && !item.qty && !item.amount);
  if (insertIdx < 0) insertIdx = cardItems.length;
  queue.forEach((item, i) => {
    const row = { brand: item.brand || '', model: item.model || '', cat: item.cat || '', qty: item.qty || '', amount: item.amount || '' };
    const idx = insertIdx + i;
    if (idx < cardItems.length) cardItems[idx] = row;
    else cardItems.push(row);
  });
  renderCardTable();
  calcCardTotal();
  toast('已載入 ' + queue.length + ' 筆掃碼材料');
}

function clearCard() {
  if (!confirm('確定清空所有材料卡項目？')) return;
  initCardItems();
  renderCardTable();
  calcCardTotal();
  document.getElementById('card-customer').value = '';
  const t = new Date();
  document.getElementById('card-no').value = t.getFullYear() + String(t.getMonth()+1).padStart(2,'0') + String(t.getDate()).padStart(2,'0') + 'A';
  document.getElementById('card-project').value = '';
  document.getElementById('card-date').value = t.toISOString().slice(0, 10);
  document.getElementById('card-status').textContent = '';
  toast('已清空');
}

async function createCardSheet() {
  const customer = document.getElementById('card-customer').value;
  const cardNo   = document.getElementById('card-no').value.trim();
  const project  = document.getElementById('card-project').value;
  const date     = document.getElementById('card-date').value;
  if (!customer) { toast('請選擇客戶名稱'); return; }
  if (!project)  { toast('請選擇案件名稱'); return; }
  const items = cardItems.filter(item => item.brand || item.model || item.cat || item.qty || item.amount);
  if (!items.length) { toast('請至少填寫一筆項目'); return; }
  const sheetName = date + '_' + customer + '_' + project;
  const total = items.reduce((s, item) => s + (Number(item.amount) || 0), 0);
  const statusEl = document.getElementById('card-status');
  if (statusEl) statusEl.textContent = '建立中…';
  try {
    const resp = await fetch(GAS_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action: 'createSheet', sheetName, customer, cardNo, project, date, total,
        items: items.map((item, i) => ({ seq: i + 1, brand: item.brand, model: item.model, cat: item.cat, qty: Number(item.qty) || 0, amount: Number(item.amount) || 0 }))
      })
    });
    const result = await resp.json();
    if (result.ok) {
      toast('已建立 Google Sheet');
      if (statusEl) {
        if (result.url) {
          statusEl.innerHTML = '已建立：<a href="' + result.url + '" target="_blank" style="color:var(--accent)">' + sheetName + '</a>';
        } else {
          statusEl.textContent = '已建立：' + sheetName;
        }
      }
    } else {
      toast('建立失敗：' + (result.error || '未知錯誤'));
      if (statusEl) statusEl.textContent = '建立失敗';
    }
  } catch(e) {
    toast('建立失敗');
    if (statusEl) statusEl.textContent = '建立失敗';
  }
}

// ── 出貨單 ───────────────────────────────────────────
let invoiceItems = [];
let currentInvoiceId = null;
const INV_EMPTY_ROWS = 5;

function newInvoice() {
  currentInvoiceId = null;
  document.getElementById('inv-no').value = '';
  document.getElementById('inv-date').value = new Date().toISOString().slice(0, 10);
  document.getElementById('inv-customer').value = '';
  document.getElementById('invoice-status').textContent = '';
  invoiceItems = [];
  for (let i = 0; i < INV_EMPTY_ROWS; i++) invoiceItems.push({ seq: i+1, name: '', qty: '', amount: '', note: '' });
  renderInvItems();
  calcInvTotal();
  toast('已清空，可開始填寫新出貨單');
}

function renderInvItems() {
  const tbody = document.getElementById('inv-items-tbody');
  tbody.innerHTML = invoiceItems.map((item, i) => `
    <tr>
      <td style="text-align:center;color:var(--text-3);font-size:12px">${i + 1}</td>
      <td><input class="card-inp" data-field="name" data-idx="${i}" oninput="invoiceItems[${i}].name=this.value;autoFillQty(${i})"></td>
      <td><input class="card-inp" type="number" data-field="qty" data-idx="${i}" oninput="invoiceItems[${i}].qty=this.value" style="text-align:center"></td>
      <td><input class="card-inp" type="number" data-field="amount" data-idx="${i}" oninput="invoiceItems[${i}].amount=this.value;calcInvTotal()" style="text-align:right"></td>
      <td><input class="card-inp" data-field="note" data-idx="${i}" oninput="invoiceItems[${i}].note=this.value"></td>
      <td style="text-align:center"><button onclick="removeInvItem(${i})" style="background:none;border:none;cursor:pointer;color:var(--red);font-size:14px;opacity:0.4">×</button></td>
    </tr>`).join('');
  setInvInputValues();
}
function autoFillQty(i) {
  if (invoiceItems[i].name && !invoiceItems[i].qty) {
    invoiceItems[i].qty = 1;
    const qtyInp = document.querySelector('#inv-items-tbody input[data-field="qty"][data-idx="'+i+'"]');
    if (qtyInp) { qtyInp.value = 1; qtyInp.setAttribute('value', '1'); }
  }
}
function setInvInputValues() {
  document.querySelectorAll('#inv-items-tbody input[data-field]').forEach(inp => {
    const idx = parseInt(inp.dataset.idx);
    const field = inp.dataset.field;
    const val = invoiceItems[idx] ? (invoiceItems[idx][field] || '') : '';
    inp.value = val;
    inp.setAttribute('value', val);
  });
}

function calcInvTotal() {
  const total = invoiceItems.reduce((s, item) => s + (Number(item.amount) || 0), 0);
  const el = document.getElementById('inv-total-cell');
  if (el) el.textContent = '$' + total.toLocaleString();
}

function addInvItem() {
  invoiceItems.push({ seq: invoiceItems.length + 1, name: '', qty: '', amount: '', note: '' });
  renderInvItems();
}

function removeInvItem(i) {
  if (invoiceItems.length <= 1) { invoiceItems[0] = { seq:1, name:'', qty:'', amount:'', note:'' }; }
  else invoiceItems.splice(i, 1);
  renderInvItems();
  calcInvTotal();
}

async function saveInvoice() {
  const invoiceNo = document.getElementById('inv-no').value.trim();
  const date = document.getElementById('inv-date').value;
  const customer = document.getElementById('inv-customer').value.trim();
  const items = invoiceItems.filter(it => it.name);
  if (!items.length) { toast('請至少填寫一筆品項'); return; }
  const totalAmount = items.reduce((s, it) => s + (Number(it.amount) || 0), 0);
  const statusEl = document.getElementById('invoice-status');
  if (statusEl) statusEl.textContent = '儲存中…';
  try {
    const resp = await fetch(GAS_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action: 'saveInvoice', recordId: currentInvoiceId,
        invoiceNo, date, customer,
        items: items.map((it, i) => ({ seq: i+1, name: it.name, qty: Number(it.qty)||0, amount: Number(it.amount)||0, note: it.note||'' })),
        totalAmount
      })
    });
    const result = await resp.json();
    if (result.ok) {
      currentInvoiceId = result.recordId;
      toast('已儲存：' + result.recordId);
      if (statusEl) statusEl.textContent = '已儲存 ' + result.recordId;
    } else {
      toast('儲存失敗：' + (result.error || '未知錯誤'));
      if (statusEl) statusEl.textContent = '儲存失敗';
    }
  } catch(e) {
    toast('儲存失敗');
    if (statusEl) statusEl.textContent = '儲存失敗';
  }
}

// ── 材料選取 Modal ───────────────────────────────────
let pickerTarget = 'invoice'; // 'invoice' or 'card'
function showMaterialPicker(target) {
  pickerTarget = target || 'invoice';
  document.getElementById('picker-search').value = '';
  filterPickerMaterials();
  document.getElementById('material-picker-modal').style.display = 'flex';
}
function hideMaterialPicker() {
  document.getElementById('material-picker-modal').style.display = 'none';
}
function filterPickerMaterials() {
  const q = (document.getElementById('picker-search').value || '').toLowerCase();
  const rows = materials.filter(m =>
    !q || (m.brand||'').toLowerCase().includes(q) || m.model.toLowerCase().includes(q)
  );
  document.getElementById('picker-tbody').innerHTML = rows.map(m => `
    <tr>
      <td>${esc(m.brand||'')}</td>
      <td style="font-size:12px">${esc(m.model)}</td>
      <td><button class="btn btn-sm btn-primary" onclick="pickMaterial('${esc(m.id)}')">選取</button></td>
    </tr>`).join('') || '<tr><td colspan="3" style="text-align:center;color:var(--text-3)">沒有符合的材料</td></tr>';
}
function pickMaterial(matId) {
  const m = materials.find(x => x.id === matId);
  if (!m) return;
  hideMaterialPicker();
  if (pickerTarget === 'card') {
    let idx = cardItems.findIndex(item => !item.brand && !item.model && !item.cat && !item.qty && !item.amount);
    if (idx < 0) { idx = cardItems.length; cardItems.push({ brand: '', model: '', cat: '', qty: '', amount: '' }); }
    cardItems[idx] = { brand: m.brand || '', model: m.model || '', cat: m.cat || '', qty: 1, amount: m.price || 0 };
    renderCardTable();
    calcCardTotal();
    toast('已加入材料卡：' + m.brand + ' ' + m.model);
  } else {
    let idx = invoiceItems.findIndex(it => !it.name && !it.qty && !it.amount);
    if (idx < 0) { idx = invoiceItems.length; invoiceItems.push({}); }
    invoiceItems[idx] = { seq: idx+1, name: (m.brand ? m.brand+' ' : '') + m.model, qty: 1, amount: '', note: '' };
    renderInvItems();
    calcInvTotal();
    toast('已加入出貨單：' + m.brand + ' ' + m.model);
  }
}

// ── 銷貨紀錄 ─────────────────────────────────────────
let salesRecords = [];
let salesFilterPeriod = 'all';

async function loadSalesRecords() {
  document.getElementById('sales-loading').style.display = 'block';
  try {
    const resp = await fetch(GAS_URL + '?include=sales');
    const data = await resp.json();
    salesRecords = data.sales || [];
    renderSalesTable();
    document.getElementById('sales-loading').style.display = 'none';
  } catch(e) {
    document.getElementById('sales-loading').style.display = 'none';
    toast('載入銷貨紀錄失敗');
  }
}

function fmtDate(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d)) return String(v);
  return d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
}
function renderSalesTable() {
  const q = (document.getElementById('sales-search').value || '').toLowerCase();
  const now = new Date();
  const rows = salesRecords.filter(r => {
    if (q) {
      const match = (r['客戶']||'').toLowerCase().includes(q) || (r['出貨單號']||'').toLowerCase().includes(q) || (r['紀錄ID']||'').toLowerCase().includes(q);
      if (!match) return false;
    }
    if (salesFilterPeriod !== 'all' && r['日期']) {
      const d = new Date(r['日期']);
      if (salesFilterPeriod === 'month') { if (d.getMonth() !== now.getMonth() || d.getFullYear() !== now.getFullYear()) return false; }
      if (salesFilterPeriod === 'week') { const diff = (now - d) / 86400000; if (diff > 7 || diff < 0) return false; }
    }
    return true;
  });
  document.getElementById('sales-count').textContent = '共 ' + rows.length + ' 筆';
  const tbody = document.getElementById('sales-tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state">沒有符合的紀錄</div></td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td><span class="badge badge-blue">${esc(r['紀錄ID']||'')}</span></td>
      <td>${fmtDate(r['日期'])}</td>
      <td>${esc(r['客戶']||'')}</td>
      <td>${esc(r['出貨單號']||'')}</td>
      <td style="text-align:right;font-weight:500">$${(Number(r['合計金額'])||0).toLocaleString()}</td>
      <td><button class="btn btn-sm" onclick="viewSalesDetail('${esc(r['紀錄ID']||'')}')">檢視</button></td>
    </tr>`).join('');
}

function setSalesFilter(period, btn) {
  salesFilterPeriod = period;
  document.querySelectorAll('#sales-filter-row .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderSalesTable();
}

function viewSalesDetail(recordId) {
  const r = salesRecords.find(x => x['紀錄ID'] === recordId);
  if (!r) return;
  let items = [];
  try { items = JSON.parse(r['品項JSON'] || '[]'); } catch(e) {}
  const content = document.getElementById('sales-detail-content');
  content.innerHTML = `
    <div class="form-grid" style="margin-bottom:1rem;grid-template-columns:1fr 1fr 1fr">
      <div class="form-group"><label>客戶名稱</label><div style="padding:8px 0;font-weight:500">${esc(r['客戶']||'—')}</div></div>
      <div class="form-group"><label>出貨單號</label><div style="padding:8px 0;font-weight:500">${esc(r['出貨單號']||'—')}</div></div>
      <div class="form-group"><label>日期</label><div style="padding:8px 0;font-weight:500">${fmtDate(r['日期'])}</div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>項次</th><th>品名規格</th><th>數量</th><th>金額</th><th>備註</th></tr></thead>
        <tbody>${items.map((it,i) => `
          <tr>
            <td style="text-align:center">${it.seq || (i+1)}</td>
            <td>${esc(it.name||'')}</td>
            <td style="text-align:center">${it.qty||''}</td>
            <td style="text-align:right">$${(Number(it.amount)||0).toLocaleString()}</td>
            <td>${esc(it.note||'')}</td>
          </tr>`).join('')}
        </tbody>
        <tfoot><tr style="background:var(--bg)"><td colspan="3" style="text-align:right;font-weight:700">合計</td><td style="text-align:right;font-weight:700">$${(Number(r['合計金額'])||0).toLocaleString()}</td><td></td></tr></tfoot>
      </table>
    </div>`;
  document.getElementById('sales-edit-btn').setAttribute('onclick', `editSalesRecord('${esc(recordId)}')`);
  document.getElementById('sales-detail-modal').style.display = 'flex';
}

function hideSalesDetail() {
  document.getElementById('sales-detail-modal').style.display = 'none';
}

function editSalesRecord(recordId) {
  const r = salesRecords.find(x => x['紀錄ID'] === recordId);
  if (!r) return;
  hideSalesDetail();
  currentInvoiceId = recordId;
  document.getElementById('inv-no').value = r['出貨單號'] || '';
  var dv = r['日期'] || '';
  if (dv) { var dd = new Date(dv); if (!isNaN(dd)) dv = dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0'); }
  document.getElementById('inv-date').value = dv;
  document.getElementById('inv-customer').value = r['客戶'] || '';
  let items = [];
  try { items = JSON.parse(r['品項JSON'] || '[]'); } catch(e) {}
  invoiceItems = items.length ? items : [{ seq:1, name:'', qty:'', amount:'', note:'' }];
  renderInvItems();
  calcInvTotal();
  showPage('invoice', document.querySelectorAll('header nav a')[2]);
  toast('已載入 ' + recordId + ' 編輯中');
}
